[platformio]
default_envs = t3-v161-433

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
extra_scripts =
    pre:scripts/git_version.py
    pre:scripts/apply_multi_uv_dashboard.py
    pre:scripts/apply_sensor_status_ui.py
    pre:scripts/apply_uv_outputs.py
    pre:scripts/apply_technoline_oled_status.py
    pre:scripts/apply_sd_datalogger.py
    pre:scripts/apply_v21_cycle_quality.py
    pre:scripts/apply_ec70_probe_ui.py
    pre:scripts/generate_web_ui.py
    pre:scripts/apply_uvr128_recovery.py
    pre:scripts/apply_ec70_probe_recovery.py
lib_deps =
    jgromes/RadioLib
    olikraus/U8g2
    knolleary/PubSubClient
    adafruit/Adafruit BME280 Library
    https://github.com/christandlg/AS3935MI/archive/01ee19264742839414b11f701c4266ded948f033.zip
build_flags =
    -D CORE_DEBUG_LEVEL=0
    ; EC70 and 1D20 can expose a clipped V2.1 preamble/Manchester phase to the
    ; SX1278 data slicer. The normal decoder remains unchanged; an isolated
    ; end-of-burst recovery accepts only EC70/1D20 with a valid checksum.
    -D OREGON_V21_PREAMBLE_MIN_LONGS=10

; 1D20/EC70 session quality is cycle-aware: redundant copies inside the same
; transmission are diagnostic frames and do not inflate Rx/Expected. The EC70
; passive probe instruments the existing phase scan only; it adds no decoder
; pass and never changes frame acceptance.
; Sensor-status UI/OLED/MQTT validation is performed by the standard CI matrix,
; including the Technoline RSSI grade on the OLED meta line.
; LILYGO/TTGO LoRa32 T3 V1.6.1 - ESP32 + SX1278 433 MHz
[env:t3-v161-433]
board = ttgo-lora32-v21
board_build.variant = ttgo-lora32-v21new
build_flags =
    ${env.build_flags}
    -D BOARD_T3_V16_SX1278=1

; Variante opzionale: LILYGO T3-S3 V1.2/V1.3 + SX1278 433 MHz
[env:t3-s3-433]
board = lilygo-t3-s3
build_flags =
    ${env.build_flags}
    -D BOARD_T3_S3_SX1278=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
