[platformio]
default_envs = t3-v161-433

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
extra_scripts =
    pre:scripts/git_version.py
    pre:scripts/apply_multi_uv_dashboard.py
    pre:scripts/apply_sensor_status_ui.py
    pre:scripts/apply_uv_outputs.py
    pre:scripts/apply_technoline_oled_status.py
    pre:scripts/apply_sd_datalogger.py
    pre:scripts/apply_sd_format_tools_safe.py
    pre:scripts/apply_sd_idempotence_guard.py
    pre:scripts/apply_v21_cycle_quality.py
    pre:scripts/apply_burst_debug_ui.py
    pre:scripts/apply_dashboard_consistency.py
    pre:scripts/apply_sdfat_backend.py
    pre:scripts/apply_web_provisioning_ota_auth.py
    pre:scripts/apply_web_bootstrap_oled.py
    pre:scripts/apply_web_idempotence_restore.py
    pre:scripts/generate_web_ui.py
    pre:scripts/apply_uvr128_recovery.py
lib_deps =
    jgromes/RadioLib
    olikraus/U8g2
    knolleary/PubSubClient
    adafruit/Adafruit BME280 Library
    greiman/SdFat@^2.3.1
    https://github.com/christandlg/AS3935MI/archive/01ee19264742839414b11f701c4266ded948f033.zip
build_flags =
    -D CORE_DEBUG_LEVEL=0
    ; SdFat replaces the Arduino-ESP32 SD transport that times out on some
    ; valid cards after CMD0. FAT16/FAT32 is enough for the logger and avoids
    ; linking exFAT and dedicated multi-block support.
    -D SDFAT_FILE_TYPE=1
    -D ENABLE_DEDICATED_SPI=0
    ; EC70/UVR128 V2.1 repeats the whole message with no inter-copy pause.
    ; The shared raw-burst buffer preserves both copies so the second preamble
    ; remains recoverable when the first copy starts clipped by the data slicer.
    -D OREGON_V21_PREAMBLE_MIN_LONGS=10

; 1D20/EC70 session quality remains cycle-aware. BURST DEBUG is the shared
; diagnostic path for Oregon V2.1/OSV3 and Technoline; the former EC70-specific
; probe is intentionally not linked to save Flash. Raw accepted frames plus the
; generic burst history are sufficient for protocol-level troubleshooting.
; SD uses Greiman SdFat instead of the Arduino-ESP32 SD transport. The first
; attempt follows the LILYGO T3 V1.6.1 HSPI wiring at 4 MHz; one clean 400 kHz
; fallback handles slow/old cards. SdFat also formats an invalid FAT after the
; card transport has initialized and exposes its precise error code in Web.
; SD format/UI patching is idempotent and tolerant of workspaces modified by
; previous PlatformIO pre-script runs. Final UI consistency removes the
; non-existent Technoline UV card and normalizes SD failure presentation.
; Web provisioning/auth/OTA runs after the storage backend so it can protect
; all generated SD endpoints and drive the final SdFat mount-retry state before
; the dashboard is gzip-compressed into the firmware. The one-time generated
; administrator credentials are also shown on OLED for 60 seconds at first
; boot. A final compatibility pass keeps legacy SD route anchors intact while
; authentication stays enforced inside the corresponding handlers for
; repeat-build idempotence.

; LILYGO/TTGO LoRa32 T3 V1.6.1 - ESP32 + SX1278 433 MHz
[env:t3-v161-433]
board = ttgo-lora32-v21
board_build.variant = ttgo-lora32-v21new
; The Web UI is embedded in firmware and this project does not use SPIFFS.
; min_spiffs keeps NVS and two OTA slots while raising each app slot from
; 0x140000 to 0x1E0000 bytes.
board_build.partitions = min_spiffs.csv
build_flags =
    ${env.build_flags}
    -D BOARD_T3_V16_SX1278=1

; Variante opzionale: LILYGO T3-S3 V1.2/V1.3 + SX1278 433 MHz
[env:t3-s3-433]
board = lilygo-t3-s3
board_build.partitions = min_spiffs.csv
build_flags =
    ${env.build_flags}
    -D BOARD_T3_S3_SX1278=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
