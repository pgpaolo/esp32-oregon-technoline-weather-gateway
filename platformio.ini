[platformio]
default_envs = t3-v161-433

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
extra_scripts =
    pre:scripts/git_version.py
    pre:scripts/apply_bme280_i2c_main_hotfix.py
    pre:scripts/apply_bme280_i2c_main_compile_fix.py
lib_deps =
    jgromes/RadioLib
    olikraus/U8g2
    knolleary/PubSubClient
    adafruit/Adafruit BME280 Library
build_flags =
    -D CORE_DEBUG_LEVEL=1

; Main hotfix candidate: keep the shared OLED/BME280 I2C bus at the
; hardware-validated 100 kHz runtime speed with an 80 ms Wire timeout.
; Discovery/recovery and the manual I2C/HW diagnostics are applied by the
; dedicated pre-scripts above without importing unrelated RC4 features.

; LILYGO/TTGO LoRa32 T3 V1.6.1 - ESP32 + SX1278 433 MHz
[env:t3-v161-433]
board = ttgo-lora32-v21
board_build.variant = ttgo-lora32-v21new
build_flags =
    ${env.build_flags}
    -D BOARD_T3_V16_SX1278=1

; Variante opzionale: LILYGO T3-S3 V1.2/V1.3 + SX1278 433 MHz
[env:t3-s3-433]
board = lilygo-t3-s3
build_flags =
    ${env.build_flags}
    -D BOARD_T3_S3_SX1278=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
