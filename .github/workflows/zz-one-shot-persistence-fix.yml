name: Apply Web UI persistence patch

on:
  push:
    branches:
      - fix/webui-nvs-persistence
    paths:
      - scripts/apply_webui_nvs_persistence_fix.py
      - .github/workflows/zz-one-shot-persistence-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/webui-nvs-persistence
          fetch-depth: 0
      - name: Apply persistence patch
        run: python3 scripts/apply_webui_nvs_persistence_fix.py
      - name: Commit generated source
        run: |
          if git diff --quiet -- src/network_manager.cpp src/display_manager.cpp src/mqtt_publisher.cpp src/web_manager.cpp; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/network_manager.cpp src/display_manager.cpp src/mqtt_publisher.cpp src/web_manager.cpp
          git commit -m "Harden Web UI settings persistence"
          git push origin HEAD:fix/webui-nvs-persistence
