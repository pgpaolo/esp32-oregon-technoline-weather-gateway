name: Apply RF persistence hardening

on:
  push:
    branches:
      - fix/webui-nvs-persistence
    paths:
      - scripts/apply_rf_nvs_hardening.py
      - .github/workflows/zz-one-shot-rf-nvs-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/webui-nvs-persistence
          fetch-depth: 0
      - name: Apply RF NVS hardening
        run: python3 scripts/apply_rf_nvs_hardening.py
      - name: Commit generated source
        run: |
          if git diff --quiet -- src/oregon_receiver.cpp src/oregon_receiver.h src/web_manager.cpp; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/oregon_receiver.cpp src/oregon_receiver.h src/web_manager.cpp
          git commit -m "Verify persistent RF settings from Web UI"
          git push origin HEAD:fix/webui-nvs-persistence
