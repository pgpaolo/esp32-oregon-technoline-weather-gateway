name: PlatformIO Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platformio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.environment }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        environment:
          - t3-v161-433
          - t3-s3-433

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-platformio-${{ matrix.environment }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-${{ matrix.environment }}-
            ${{ runner.os }}-platformio-

      - name: Install PlatformIO Core
        run: python -m pip install --upgrade platformio

      - name: Show PlatformIO version
        run: pio --version

      - name: Build firmware
        run: pio run -e "${{ matrix.environment }}"

      - name: Verify BME280 I2C hotfix integration
        run: python scripts/test_bme280_i2c_main_hotfix.py

      - name: Rebuild same workspace (idempotence)
        run: pio run -e "${{ matrix.environment }}"

      - name: Re-verify hotfix after second build
        run: python scripts/test_bme280_i2c_main_hotfix.py

      - name: Upload firmware artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.environment }}
          path: |
            .pio/build/${{ matrix.environment }}/*.bin
            .pio/build/${{ matrix.environment }}/firmware.elf
          if-no-files-found: warn
          retention-days: 14
