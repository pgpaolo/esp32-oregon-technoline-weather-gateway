name: PlatformIO Build
# Branch CI: verifies generated integrations and physical firmware.bin size.

on:
  push:
    branches:
      - main
      - release/6.4.0-rc3
      - release/6.4.0-rc4
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platformio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.environment }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        environment:
          - t3-v161-433
          - t3-s3-433

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-platformio-${{ matrix.environment }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-${{ matrix.environment }}-
            ${{ runner.os }}-platformio-

      - name: Install PlatformIO Core
        run: python -m pip install --upgrade platformio

      - name: Show PlatformIO version
        run: pio --version

      - name: Apply PCR800 rain-rate decoder fix
        run: python scripts/apply_pcr800_rain_rate_fix.py

      - name: Validate PCR800 rain-rate vector
        run: python scripts/test_pcr800_rain_rate.py

      - name: Validate Oregon V2.1 protocol vectors
        run: python scripts/test_oregon_v21.py

      - name: Validate MB-compatible realtime mapping
        run: python scripts/test_mb_compatible_mapping.py

      - name: Build firmware
        run: pio run -e "${{ matrix.environment }}"

      # PlatformIO pre-scripts intentionally patch generated source in-place.
      # A second build in the same checkout reproduces the local/Windows flow
      # and detects duplicate generated handlers, routes and UI blocks.
      - name: Rebuild same workspace (SD/Web idempotence)
        if: matrix.environment == 't3-v161-433'
        run: pio run -e "${{ matrix.environment }}"

      - name: Validate generated I2C/HW integration
        run: python scripts/test_generated_i2c_hardware_diagnostics.py

      - name: Verify real firmware.bin size
        shell: bash
        run: |
          BIN=".pio/build/${{ matrix.environment }}/firmware.bin"
          SIZE=$(stat -c%s "$BIN")
          echo "firmware.bin size: ${SIZE} bytes"
          if [ "${{ matrix.environment }}" = "t3-v161-433" ]; then
            # min_spiffs.csv uses two 0x1E0000 application slots.
            MAX=1966080
            MARGIN=$((MAX - SIZE))
            echo "T3 V1.6.1 app partition: ${MAX} bytes"
            echo "Real margin: ${MARGIN} bytes"
            if [ "$SIZE" -gt "$MAX" ]; then
              echo "ERROR: firmware.bin exceeds the application partition by $((SIZE - MAX)) bytes"
              exit 1
            fi
          fi

      - name: Upload firmware artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.environment }}
          path: |
            .pio/build/${{ matrix.environment }}/*.bin
            .pio/build/${{ matrix.environment }}/firmware.elf
          if-no-files-found: warn
          retention-days: 14
