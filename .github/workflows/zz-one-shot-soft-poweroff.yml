name: Apply controller soft power-off

on:
  push:
    branches:
      - feature/controller-soft-poweroff
    paths:
      - scripts/apply_soft_poweroff.py
      - .github/workflows/zz-one-shot-soft-poweroff.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/controller-soft-poweroff
          fetch-depth: 0
      - name: Apply soft power-off patch
        run: python3 scripts/apply_soft_poweroff.py
      - name: Commit generated source
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/config.h src/display_manager.cpp src/barometer_manager.cpp src/mqtt_publisher.cpp src/oregon_receiver.h src/oregon_receiver.cpp src/web_manager.cpp CHANGELOG.md README_IT.md
          git commit -m "Add Web soft power-off and deep sleep"
          git push origin HEAD:feature/controller-soft-poweroff
