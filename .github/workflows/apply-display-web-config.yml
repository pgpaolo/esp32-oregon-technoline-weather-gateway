name: Apply display web config patch

on:
  push:
    branches:
      - feature/display-web-config
    paths:
      - scripts/apply_display_web_config.py
      - .github/workflows/apply-display-web-config.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/display-web-config
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Apply patch
        run: python scripts/apply_display_web_config.py
      - name: Commit generated source
        run: |
          if git diff --quiet -- src/web_manager.cpp; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/web_manager.cpp
          git commit -m "Add Web UI for configurable OLED pages"
          git push origin HEAD:feature/display-web-config
