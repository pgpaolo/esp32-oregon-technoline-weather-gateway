name: Validate

on:
  push:
    branches:
      - 'main'
      - 'develop'
  pull_request:
    branches:
      - 'main'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-validation:
    name: Repository validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Validate repository
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f LICENSE
          git diff --check
          echo "Repository validation completed successfully."
