name: Fix Multichannel MQTT JSON

on:
  push:
    branches:
      - feature/oregon-multichannel-thermo
    paths:
      - .github/workflows/fix-multichannel-mqtt.yml
  pull_request:
    branches:
      - feature/as3935-lightning
    paths:
      - .github/workflows/fix-multichannel-mqtt.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/oregon-multichannel-thermo
          fetch-depth: 0
      - name: Repair channel-state JSON literals
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/mqtt_publisher.cpp')
          s = p.read_text(encoding='utf-8')
          scope = s.index('        if (fieldEnabled(MQTT_F_RF_META)) {')
          start = s.index('            String j;', scope)
          end = s.index('            snprintf(suffix, sizeof(suffix), "oregon/thermo/ch%u/state", reading.channel);', start)
          new = r'''            String j;
              j.reserve(200);
              char sensorCode[5];
              snprintf(sensorCode, sizeof(sensorCode), "%04X", reading.sensorCode);
              j = "{\"channel\":" + String(reading.channel);
              j += ",\"temperature_c\":" + String(reading.temperatureC, 1);
              j += ",\"humidity_pct\":" + String(reading.humidityPct, 0);
              j += ",\"sensor_code\":\"" + String(sensorCode) + "\"";
              j += ",\"rolling_code\":" + String(reading.rollingCode);
              j += ",\"battery\":\"" + String(batteryStatusName(reading)) + "\"";
              j += ",\"rssi\":";
              if (isnan(reading.rssi)) j += "null";
              else j += String(reading.rssi, 1);
              j += "}";
          '''
          p.write_text(s[:start] + new + s[end:], encoding='utf-8')
          Path('.github/workflows/fix-multichannel-mqtt.yml').unlink()
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: repair multichannel MQTT JSON encoding"
          git push origin HEAD:feature/oregon-multichannel-thermo
