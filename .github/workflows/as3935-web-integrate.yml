name: AS3935 Integration Guard

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify main-UI integration
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'AS3935_UI_INTEGRATED' src/web_manager.cpp
          grep -q '/api/as3935/state' src/web_manager.cpp
          grep -q '/api/as3935/config' src/web_manager.cpp
          grep -q 'lightning_manager.h' src/main.cpp

          if grep -REn 'lightning_web\.h|initLightningWeb|serviceLightningWeb|WebServer[[:space:]]+[^;]*\(81\)' src; then
            echo 'Standalone AS3935 Web UI / port 81 reference found.' >&2
            exit 1
          fi

          echo 'AS3935 is integrated into the main Web UI; no standalone port-81 server found.'
