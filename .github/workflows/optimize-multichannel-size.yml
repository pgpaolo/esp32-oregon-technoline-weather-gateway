name: Optimize Multichannel Size

on:
  pull_request:
    branches:
      - feature/as3935-lightning
    paths:
      - .github/workflows/optimize-multichannel-size.yml

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/oregon-multichannel-thermo
          fetch-depth: 0
      - name: Compact multichannel Web state
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/web_manager.cpp')
          s = p.read_text(encoding='utf-8')

          start = s.index('    const ThermoChannelConfig thermoCfg = getThermoChannelConfig();')
          end = s.index(r'    out += ",\"rf\":{";', start)
          compact = r'''    const ThermoChannelConfig thermoCfg = getThermoChannelConfig();
              out += ",\"oregon_thermo\":{\"m\":" + String(thermoEffectiveMask());
              out += ",\"p\":" + String(thermoCfg.primaryChannel) + ",\"c\":[";
              for (uint8_t ch = 1; ch <= 3; ++ch) {
                  if (ch > 1) out += ",";
                  const ThermoChannelState ts = getThermoChannelState(ch);
                  out += "{\"t\":" + jsonFloat(ts.temperatureC, 1);
                  out += ",\"h\":" + jsonFloat(ts.humidityPct, 0);
                  out += ",\"a\":" + String(ageSeconds(ts.updatedMs, now));
                  out += ",\"r\":" + jsonFloat(ts.lastRssi, 1);
                  out += ",\"id\":\"" + hex4(ts.sensor.code) + "\"";
                  out += ",\"b\":\"" + String(sensorBatteryName(ts.sensor)) + "\"}";
              }
              out += "]}";

          '''
          s = s[:start] + compact + s[end:]

          js_start = s.index('const thMask=Number(th.visible_mask||0)')
          js_end_token = "setFresh('ageT',tv.age_s,tvOk);"
          js_end = s.index(js_end_token, js_start) + len(js_end_token)
          compact_js = r'''const thMask=Number(th.m||0),thPrimary=Number(th.p||1);if(!(thMask&(1<<(thermoViewChannel-1))))thermoViewChannel=thPrimary;for(let ch=1;ch<=3;ch++){const bt=E('tch'+ch),vis=(thMask&(1<<(ch-1)))!==0;if(bt){bt.classList.toggle('show',vis);bt.classList.toggle('active',ch===thermoViewChannel);bt.textContent='CH'+ch+(ch===thPrimary?'*':'')}}const tv=((th.c||[])[thermoViewChannel-1])||{},primaryView=thermoViewChannel===thPrimary,tvOk=isO&&tv.t!=null&&tv.h!=null&&Number(tv.a||4294967295)<=Number(sess.age_s||0);E('thermoDerivedHeat').style.display=primaryView?'flex':'none';E('thermoDerivedDew').style.display=primaryView?'flex':'none';E('spTemp').style.display=primaryView?'block':'none';if(!tvOk){showOrWait(temp,false,'');showOrWait(hum,false,'');if(primaryView){showOrWait(hi,false,'');showOrWait(dew,false,'')}ageT.textContent='ultimo dato '+age(tv.a)}else{showOrWait(temp,true,f(tv.t,1,' °C'));showOrWait(hum,true,f(tv.h,0,' %'));if(primaryView){showOrWait(hi,true,w.heat_index_c==null?'N/A':f(w.heat_index_c,1,' °C'));showOrWait(dew,true,f(w.dew_point_c,1,' °C'))}ageT.textContent=age(tv.a)}footT.innerHTML='CH'+thermoViewChannel+(primaryView?' principale':'')+' · '+(tv.id||'----')+' · BAT '+(tv.b||'N/D')+' · '+f(tv.r,1,' dBm');setFresh('ageT',tv.a,tvOk);'''
          s = s[:js_start] + compact_js + s[js_end:]

          note_start = s.find('<div class="cfgNote"><b>Canale principale:</b>')
          if note_start >= 0:
              note_end = s.index('</div>', note_start) + len('</div>')
              short_note = '<div class="cfgNote"><b>Principale:</b> alimenta meteo e MQTT legacy. I canali manuali restano visibili offline; Auto aggiunge quelli rilevati.</div>'
              s = s[:note_start] + short_note + s[note_end:]

          p.write_text(s, encoding='utf-8')

          h = Path('src/thermo_channel_manager.h')
          hs = h.read_text(encoding='utf-8')
          hs = hs.replace('    uint32_t packetCount{0};\n', '')
          h.write_text(hs, encoding='utf-8')

          c = Path('src/thermo_channel_manager.cpp')
          cs = c.read_text(encoding='utf-8')
          cs = cs.replace('        Serial.println(F("[THERMO] NVS non disponibile: CH1 principale"));\n', '')
          log = '''    Serial.print(F("[THERMO] primary=CH")); Serial.print(cfg.primaryChannel);\n    Serial.print(F(" enabled=0x")); Serial.print(cfg.enabledMask, HEX);\n    Serial.print(F(" auto=")); Serial.println(cfg.autoDiscover ? F("ON") : F("OFF"));\n'''
          cs = cs.replace(log, '')
          cs = cs.replace('    s.packetCount++;\n', '')
          c.write_text(cs, encoding='utf-8')

          Path('.github/workflows/optimize-multichannel-size.yml').unlink(missing_ok=True)
          PY
      - name: Commit optimization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "optimize: reduce multichannel Web flash footprint"
          git push origin HEAD:feature/oregon-multichannel-thermo
